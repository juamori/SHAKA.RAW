<!doctype html>
<html lang="en" data-theme="purple" data-fx="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SHAKA.RAW — no algorithm, just me</title>
  <meta name="description" content="SHAKA.RAW — a personal corner of the internet running on SHAKA OS. No algorithm, just me. EST. 2001.">
  <meta name="theme-color" content="#080810">

  <!-- Link previews (Discord, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SHAKA.RAW">
  <meta property="og:title" content="SHAKA.RAW — no algorithm, just me">
  <meta property="og:description" content="A personal archive running inside SHAKA OS. EST. 2001.">
  <!-- After you deploy, uncomment these and use your real absolute address: -->
  <!-- <meta property="og:url" content="https://YOUR-ADDRESS/"> -->
  <!-- <meta property="og:image" content="https://YOUR-ADDRESS/assets/og-image.png"> -->
  <meta name="twitter:card" content="summary">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">

  <!-- Apply saved theme/effects before first paint (prevents a color flash) -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('shaka.raw:theme');
        if (t === 'purple' || t === 'blue' || t === 'amber') document.documentElement.dataset.theme = t;
        var f = localStorage.getItem('shaka.raw:fx');
        if (f === 'on' || f === 'off') document.documentElement.dataset.fx = f;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="statusbar">
    <a class="brand" href="#home" aria-label="SHAKA.RAW, go to home">
      <span class="brand-mark" aria-hidden="true">S</span>
      <span class="brand-os" id="brand-os">SHAKA OS</span>
    </a>
    <p class="sysmsg" id="sysmsg">all systems nominal.</p>
    <div class="controls">
      <div class="themes" role="group" aria-label="Color theme">
        <button type="button" class="swatch" data-theme-btn="purple" aria-label="Purple theme" aria-pressed="false"></button>
        <button type="button" class="swatch" data-theme-btn="blue" aria-label="Blue theme" aria-pressed="false"></button>
        <button type="button" class="swatch" data-theme-btn="amber" aria-label="Amber theme" aria-pressed="false"></button>
      </div>
      <button type="button" class="fx-btn" id="fx-btn" aria-pressed="true" aria-label="Visual effects">fx on</button>
      <time class="clock" id="clock"></time>
    </div>
  </header>

  <div class="shell">
    <nav class="dir" aria-label="Sections">
      <p class="dir-path">~/shaka</p>
      <ul class="dir-list" id="nav-list"></ul>
      <p class="dir-foot" id="dir-foot"></p>
    </nav>

    <main id="main" class="window" tabindex="-1">
      <div class="titlebar">
        <span class="elbow" id="win-addr">0x00</span>
        <span class="path" id="win-path">~/shaka/home.sys</span>
        <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="view" id="view">
        <noscript>
          <div class="noscript">
            <h1>SHAKA.RAW</h1>
            <p>no algorithm, just me. EST. 2001.</p>
            <p>SHAKA OS needs JavaScript to open its files. Turn it on to look around.</p>
          </div>
        </noscript>
      </div>
    </main>

    <aside class="term-dock" id="terminal" aria-label="Terminal">
      <div class="titlebar titlebar--term">
        <span class="elbow elbow--alt">sh</span>
        <span class="path">terminal.sh</span>
        <span class="bars" aria-hidden="true"><i></i><i></i></span>
      </div>
      <div class="term-out" id="term-out" role="log" aria-live="polite" aria-label="Terminal output" tabindex="0"></div>
      <form class="term-in" id="term-form" autocomplete="off">
        <label for="term-input" class="prompt" id="term-prompt">ko@shaka:~$</label>
        <input id="term-input" class="term-input" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" aria-describedby="term-hint">
        <span class="sr" id="term-hint">Type help and press Enter for a list of commands. Up and down arrows browse history, Tab completes.</span>
      </form>
    </aside>
  </div>

  <footer class="sysfoot" id="sysfoot"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="archive-manifest.js"></script> <!-- generated by tools/build_archive.py -->
  <script src="script.js"></script>
</body>
</html>
